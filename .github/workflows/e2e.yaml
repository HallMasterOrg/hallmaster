name: End-to-end tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js & pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --filter=@hallmaster/e2e --filter=@hallmaster/backend... --filter=@hallmaster/frontend... --frozen-lockfile

      - parallel:
        - name: Run lint
          run: pnpm --filter=@hallmaster/e2e lint

        - name: Run format check
          run: pnpm --filter=@hallmaster/e2e format:check

      - name: Install Chromium
        run: pnpm --filter=@hallmaster/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm --filter=@hallmaster/e2e test

      - name: Upload the server logs and the screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: packages/e2e/.logs/
          include-hidden-files: true
